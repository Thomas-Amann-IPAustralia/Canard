name: Tests

on:
  push:
    paths-ignore: ["data/**"]
  pull_request:
    paths-ignore: ["data/**"]

permissions:
  contents: read

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm test

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r server/requirements-dev.txt
      - run: python -m pytest -q
        working-directory: server
